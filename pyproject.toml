[project]
name = "exam-engine"
version = "0.1.0"
description = "AI-Powered Intelligent Assessment Platform - Exam Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.1.0,<4.1",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "cachetools>=5.3.0",
    "email-validator>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "import-linter>=2.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
# Phase 8 §8 / Phase 5 §11-12: no module's service.py may import sqlalchemy
# directly or build a raw select() - 100% of DB access funnels through a
# repository method. Run with: lint-imports
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "service.py never imports SQLAlchemy directly"
type = "forbidden"
source_modules = [
    "app.modules.identity.service",
    "app.modules.academic.service",
    "app.modules.student.service",
    "app.modules.teacher.service",
    "app.modules.question_bank.service",
    "app.modules.blueprint.service",
    "app.modules.paper_generation.service",
    "app.modules.exam_management.service",
    "app.modules.evaluation.service",
    "app.modules.learning_profile.service",
    "app.modules.analytics.service",
    "app.modules.recommendation.service",
    "app.modules.reports.service",
    "app.modules.storage.service",
    "app.modules.integration.service",
]
forbidden_modules = ["sqlalchemy"]
allow_indirect_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
